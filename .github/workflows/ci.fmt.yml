name: Format

on:
    pull_request:
    push:
        branches: [main, develop]

jobs:
    rustfmt:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Rust Toolchain
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rustfmt

            - name: Check Formatting
              run: cargo +nightly fmt --check
